name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint includes eslint-plugin-jsx-a11y rules for lint-time a11y checks.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e-a11y:
    name: E2E accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    # Only run once an actual Playwright E2E suite (with @axe-core/playwright
    # assertions on onboarding, send, review and dashboard flows) exists —
    # the config and tooling are in place, but no spec files have landed yet.
    if: ${{ hashFiles('e2e/**') != '' }}
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run E2E accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  csp-guard:
    name: CSP regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Assert script-src does not allow 'unsafe-inline'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const candidates = [
            'next.config.ts',
            'next.config.js',
            'next.config.mjs',
            'middleware.ts',
            'middleware.js',
            'src/middleware.ts',
            'src/middleware.js',
          ];

          const files = candidates.filter((f) => fs.existsSync(path.resolve(f)));

          if (files.length === 0) {
            console.error('No CSP configuration files found (next.config.* / middleware.*).');
            process.exit(1);
          }

          let failed = false;

          for (const file of files) {
            const content = fs.readFileSync(path.resolve(file), 'utf8');

            // Find script-src directives, including those built up across
            // template literals / concatenations. We scan the raw text for
            // any `script-src` occurrence and inspect the surrounding window.
            const scriptSrcRegex = /script-src/g;
            let match;
            while ((match = scriptSrcRegex.exec(content)) !== null) {
              const window = content.slice(match.index, match.index + 400);
              if (window.includes("'unsafe-inline'") || window.includes('"unsafe-inline"')) {
                console.error(
                  `::error file=${file}::script-src contains 'unsafe-inline' near offset ${match.index}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            console.error("CSP regression: script-src must not include 'unsafe-inline'.");
            process.exit(1);
          }

          console.log("CSP check passed: script-src does not include 'unsafe-inline'.");
          EOF

  e2e:
    name: E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    # Only run once an actual Playwright E2E suite exists (see e2e-a11y above).
    if: ${{ hashFiles('e2e/**') != '' }}
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
