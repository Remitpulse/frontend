name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint includes eslint-plugin-jsx-a11y rules for lint-time a11y checks.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e-a11y:
    name: E2E accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    # Only run once an actual Playwright E2E suite (with @axe-core/playwright
    # assertions on onboarding, send, review and dashboard flows) exists —
    # the config and tooling are in place, but no spec files have landed yet.
    if: ${{ hashFiles('e2e/**') != '' }}
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run E2E accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  csp-guard:
    name: CSP regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated CSP and nonce forwarding
        run: npm exec vitest run test/csp.test.ts test/proxy.test.ts

  e2e:
    name: E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    # Only run once an actual Playwright E2E suite exists (see e2e-a11y above).
    if: ${{ hashFiles('e2e/**') != '' }}
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
